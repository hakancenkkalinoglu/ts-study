server.port=3000
spring.config.import=optional:file:./.env[.properties]
spring.sql.init.mode=never

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/testpsikolog}
spring.datasource.username=${DB_USER:testpsikolog}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '10s'

app.jwt-secret=${JWT_SECRET:}
app.jwt-expiration-ms=604800000
app.frontend-url=${FRONTEND_URL:http://localhost:5174}
app.cors-origins=http://localhost:5173,http://localhost:5174
app.seed-enabled=${APP_SEED_ENABLED:false}
app.seed-username=${APP_SEED_USERNAME:}
app.seed-password=${APP_SEED_PASSWORD:}
app.mock-data-enabled=${APP_MOCK_DATA:false}
app.mock-password=${APP_MOCK_PASSWORD:}
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:3000/api/auth/google/callback}
app.google.tokens-path=${user.dir}/data/google-tokens.json
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB
