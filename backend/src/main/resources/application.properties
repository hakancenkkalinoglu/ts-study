server.port=3000
spring.config.import=optional:file:./.env[.properties]
spring.sql.init.mode=never

spring.datasource.url=jdbc:sqlite:${user.dir}/data/database.sqlite
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

app.jwt-secret=${JWT_SECRET:testpsikolog-secret-change-in-production}
app.jwt-expiration-ms=604800000
app.frontend-url=${FRONTEND_URL:http://localhost:5174}
app.cors-origins=http://localhost:5173,http://localhost:5174
app.seed-username=testpsikolog
app.seed-password=test1234
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:3000/api/auth/google/callback}
app.google.tokens-path=${user.dir}/data/google-tokens.json
