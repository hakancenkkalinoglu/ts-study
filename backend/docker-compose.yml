services:
  postgres:
    image: postgres:17
    container_name: testpsikolog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-testpsikolog}
      POSTGRES_USER: ${DB_USER:-testpsikolog}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
